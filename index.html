<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowTech Digital Solutions - Professional Digital Services at Bootstrap Prices</title>
    <meta name="description" content="FlowTech Digital Solutions delivers enterprise-quality web design, SEO, and digital marketing at bootstrap-friendly prices. Perfect for small businesses ready to scale.">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-primary: #667eea;
            --brand-primary-dark: #5145cd;
            --brand-secondary: #764ba2;
            --gray-50: #f9fafb;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-primary);
            line-height: 1.6;
            color: var(--gray-800);
            background: var(--gray-50);
        }
        
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
            padding: 2rem;
            text-align: center;
        }
        
        .hero-content {
            max-width: 800px;
            color: white;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }
        
        .tagline {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 3rem;
            opacity: 0.95;
        }
        
        .cta-button {
            display: inline-block;
            padding: 1.25rem 3rem;
            background: white;
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.125rem;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            background: var(--gray-50);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .tagline {
                font-size: 1.25rem;
            }
            
            .logo {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <div class="logo">
                <img src="/Brand_Assets/FlowTech_Digital_Solutions/icon-192.png" alt="FlowTech Digital Solutions" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            
            <h1>FlowTech Digital Solutions</h1>
            
            <p class="tagline">
                Professional digital services at bootstrap-friendly prices.<br>
                Enterprise quality. Small business pricing.
            </p>
            
            <a href="/services/" class="cta-button">View Our Services</a>
        </div>
    </section>
</body>
</html>
