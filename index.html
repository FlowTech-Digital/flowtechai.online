  <!-- Brand CSS Variables -->
  <style>
    :root {
      /* FlowTech AI Brand Colors (Brand Sheet v1.0) */
      --ft-azure: #1E78FF;
      --ft-obsidian: #0B1114;
      --ft-indigo: #1B3B93;
      --ft-white: #FFFFFF;
      --ft-gray-light: #F5F5F5;
      --ft-gray-dark: #333333;
      
      /* Typography */
      --ft-font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ft-font-heading: 'Space Grotesk', var(--ft-font-primary);
      
      /* Spacing */
      --ft-spacing-xs: 0.5rem;
      --ft-spacing-sm: 1rem;
      --ft-spacing-md: 2rem;
      --ft-spacing-lg: 4rem;
      --ft-spacing-xl: 6rem;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--ft-font-primary);
      background-color: var(--ft-obsidian);
      color: var(--ft-white);
      line-height: 1.6;
    }
    
    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(11, 17, 20, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      z-index: 1000;
      border-bottom: 1px solid rgba(30, 120, 255, 0.1);
    }
    
    .nav-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .nav-logo {
      font-family: var(--ft-font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ft-azure);
      text-decoration: none;
    }
    
    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    
    .nav-links a {
      color: var(--ft-white);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }
    
    .nav-links a:hover {
      color: var(--ft-azure);
    }
    
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--ft-obsidian) 0%, var(--ft-indigo) 100%);
      padding-top: 4rem;
    }
    
    .hero-content {
      text-align: center;
      padding: var(--ft-spacing-md);
    }
    
    .hero-logo {
      max-width: 600px;
      width: 100%;
      height: auto;
      margin-bottom: var(--ft-spacing-md);
    }
    
    h1 {
      font-family: var(--ft-font-heading);
      font-size: clamp(2rem, 5vw, 4rem);
      color: var(--ft-azure);
      margin-bottom: var(--ft-spacing-sm);
    }
    
    p {
      font-size: clamp(1rem, 2vw, 1.5rem);
      color: var(--ft-gray-light);
      max-width: 800px;
      margin: 0 auto var(--ft-spacing-md);
    }
    
    .cta-button {
      display: inline-block;
      background: var(--ft-azure);
      color: var(--ft-white);
      padding: 1rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s;
      margin-top: var(--ft-spacing-sm);
    }
    
    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 120, 255, 0.3);
    }
    
    @media (max-width: 768px) {
      .nav-links {
        gap: 1rem;
        font-size: 0.9rem;
      }
      
      nav {
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div class="nav-content">
      <a href="/" class="nav-logo">FlowTech Digital</a>
      <ul class="nav-links">
        <li><a href="/services.html">Services</a></li>
        <li><a href="mailto:hello@flowtechai.online">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero -->
  <main class="hero">
    <div class="hero-content">
      <img src="/assets/brand/flowtech-logo-dark-1600.png" alt="FlowTech Digital Solutions" class="hero-logo">
      <h1>Web design, branding, and high-converting landing pages</h1>
      <p>Professional quality at competitive rates. Fast turnaround. Proven results.</p>
      <p>Helping businesses establish strong digital presence and convert visitors into customers.</p>
      <a href="/services.html" class="cta-button">View Our Services</a>
    </div>
  </main>
</body>
</html>
